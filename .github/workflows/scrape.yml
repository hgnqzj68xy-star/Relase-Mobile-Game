name: 🎮 Scrape Mobile Game Releases

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: "Vider le cache et tout re-scraper"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  scrape:
    name: Fetch & Update Games Data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Full refresh (optionnel)
        if: ${{ inputs.force_full_refresh == 'true' }}
        run: |
          echo '{"lastUpdated":"","games":[]}' > data/games.json
          echo "Cache vidé"

      - name: 🎮 Run scraper
        run: python scripts/scrape.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: ✅ Valider le JSON
        run: |
          python3 -c "
          import json, sys
          with open('data/games.json') as f:
              d = json.load(f)
          games    = d.get('games', [])
          upcoming = sum(1 for g in games if g.get('status') == 'upcoming')
          released = sum(1 for g in games if g.get('status') == 'released')
          if not games:
              print('WARN: JSON vide')
              sys.exit(1)
          print(f'JSON valide : {len(games)} jeux ({released} released / {upcoming} upcoming)')
          "

      - name: 📊 Résumé
        run: |
          python3 -c "
          import json
          from datetime import datetime
          with open('data/games.json') as f:
              d = json.load(f)
          games    = d.get('games', [])
          ios      = sum(1 for g in games if 'ios'     in g.get('platform', []))
          android  = sum(1 for g in games if 'android' in g.get('platform', []))
          upcoming = sum(1 for g in games if g.get('status') == 'upcoming')
          released = sum(1 for g in games if g.get('status') == 'released')
          months   = sorted(set(g['releaseDate'][:7] for g in games))

          print('### 🎮 Résultat du scraping')
          print('')
          print('| Métrique | Valeur |')
          print('|----------|--------|')
          print(f'| Total | **{len(games)}** |')
          print(f'| iOS | {ios} |')
          print(f'| Android | {android} |')
          print(f'| Released | {released} |')
          print(f'| Upcoming | {upcoming} |')
          print(f'| Mois | {\" · \".join(months)} |')
          " >> $GITHUB_STEP_SUMMARY

      - name: 💾 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/games.backup.json || true
          if git diff --staged --quiet; then
            echo "Aucun changement"
          else
            COUNT=$(python3 -c "import json; print(len(json.load(open('data/games.json'))['games']))")
            git commit -m "🎮 Update games — ${COUNT} jeux [$(date +'%Y-%m-%d')]"
            git push
          fi

      - name: 🚨 Restaurer backup si échec
        if: failure()
        run: |
          if [ -f data/games.backup.json ]; then
            cp data/games.backup.json data/games.json
            echo "Backup restauré"
          fi
